name: Deploy to GitHub Pages
# Off until you switch it on, so a new repository starts green:
#   1. Settings > Pages > Source: GitHub Actions (a free account needs the repository public).
#   2. Settings > Secrets and variables > Actions > Variables: add PAGES_ON with the value true.
# Then every push to main deploys, and Actions > Deploy to GitHub Pages > Run workflow deploys now.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: vars.PAGES_ON == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_OW_READ_KEY: ${{ vars.VITE_OW_READ_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
